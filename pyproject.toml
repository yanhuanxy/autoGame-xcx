[project]
name = "autogame-xcx"
version = "0.1.0"
description = "WeChat mini-program game automation via image recognition"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "yanhuanxy" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PyQt6>=6.7,<7",
    "PyQt6-Qt6>=6.7,<7",
    "opencv-python>=4.10,<5",
    "numpy>=2.0,<3.0",
    "Pillow>=11.0",
    "scikit-image>=0.21",
    "pyautogui>=0.9.54",
    "pywin32>=310; platform_system=='Windows'",
    "psutil>=6.0",
    "onnxruntime>=1.17",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "jpype1>=1.7.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autogame_xcx*"]
exclude = ["test*", "tests*", "data*", "models*", "doc*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real WeChat window",
    "e2e: full template execution",
    "gui: requires PyQt6 display",
]
